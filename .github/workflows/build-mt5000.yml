name: Build ImmortalWrt for GL.iNet MT5000

on:
  workflow_dispatch:
    inputs:
      iwrt_profile:
        description: '基础版本配置档 (master=滚动快照,内核 6.18; 25.12=稳定版,内核 6.12)'
        required: false
        default: 'master'
        type: choice
        options:
          - master
          - '25.12'
      iwrt_ref:
        description: 'ImmortalWrt 基础版本 (commit/tag/branch; 留空则用 iwrt_profile 默认基线: master→f44d1535b4, 25.12→84b665b5de; 显式填写时优先, 但需自行确保补丁能套用)'
        required: false
        default: ''
        type: string
      lan_ip:
        description: '默认 LAN IP (如 10.0.0.1)'
        required: false
        default: '10.0.0.1'
        type: string
      timezone:
        description: '默认时区'
        required: false
        default: 'Asia/Shanghai'
        type: choice
        options:
          - Asia/Shanghai
          - Asia/Hong_Kong
          - Asia/Taipei
          - Asia/Tokyo
          - Asia/Singapore
          - Europe/Berlin
          - UTC
      ui_lang:
        description: 'LuCI 界面语言'
        required: false
        default: 'zh-cn'
        type: choice
        options:
          - zh-cn
          - en
      rootfs_size:
        description: '软件包分区大小 (MB)'
        required: false
        default: '2048'
        type: choice
        options:
          - '1024'
          - '2048'
          - '4096'
          - '8192'
      luci_flavor:
        description: 'LuCI 套件'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - light
      enable_store:
        description: '集成 iStore 软件商店'
        required: false
        default: true
        type: boolean
      bake_daede:
        description: '将 daede(dae/daed 代理)编译进固件 (否则刷机后脚本安装)'
        required: false
        default: false
        type: boolean
      enable_honk:
        description: '集成 honk 代理(daeuniverse 官方 apk 源, WAN 首次联网后自动安装; 内置 doona 面板 http://LAN_IP:9090/ui/; 与 bake_daede 互斥、与 dae 不能共存; 运行依赖已编入固件, 需内核 >=6.12, 两配置档均满足)'
        required: false
        default: false
        type: boolean
      extra_services:
        description: '附加服务: none=都不装; mwan3=多线管理(LuCI 网络→Multi WAN, 编入时自动只接管 IPv4, 不影响 IPv6); docker=Docker+Dockerman; docker+mwan3=两者都装'
        required: false
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'mwan3'
          - 'docker'
          - 'docker+mwan3'
      pppoe:
        description: '预置 PPPoE 拨号 (WAN 口 eth1)'
        required: false
        default: false
        type: boolean
      pppoe_username:
        description: 'PPPoE 宽带账号 (启用 PPPoE 时填写)'
        required: false
        default: ''
        type: string
      pppoe_password:
        description: 'PPPoE 密码 (留空则使用仓库 Secret: PPPOE_PASSWORD)'
        required: false
        default: ''
        type: string
      enable_ipv6:
        description: '启用 IPv6 (参考 Aethersailor wiki: WAN 委托前缀 + LAN RA/SLAAC 下发)'
        required: false
        default: false
        type: boolean
      lan_ipv6_assign:
        description: 'LAN IPv6 分配长度 ip6assign (上游只给 /64 时用 64; 要再向二级路由委派用 60/56)'
        required: false
        default: '64'
        type: choice
        options:
          - '64'
          - '60'
          - '56'
          - 'disabled'
      lan_ipv6_suffix:
        description: 'LAN 接口自身 IPv6 后缀 ip6ifaceid'
        required: false
        default: 'eui64'
        type: choice
        options:
          - 'eui64'
          - 'random'
          - '::1'
      lan_ipv6_dhcpv6:
        description: 'LAN DHCPv6 服务 (disabled = 纯 SLAAC, 兼容安卓; server = 有状态分配)'
        required: false
        default: 'disabled'
        type: choice
        options:
          - 'disabled'
          - 'server'
      lan_ipv6_dns:
        description: '向客户端通告路由器为 IPv6 DNS (false = 客户端继续用 IPv4 DNS, 保持 OpenClash 分流)'
        required: false
        default: false
        type: boolean
      hostname:
        description: '路由器主机名'
        required: false
        default: 'ImmortalWrt'
        type: string
      root_password:
        description: '默认 root 密码 (留空则保持无密码; 仅在首启且 root 尚无密码时写入)'
        required: false
        default: 'root'
        type: string
      extra_feeds:
        description: '额外软件源, 多个用 | 分隔, 每个为标准 feeds.conf 行。例: src-git ken https://github.com/kenzok8/openwrt-packages;main'
        required: false
        default: ''
        type: string
      extra_packages:
        description: '额外编译进固件的软件包, 空格分隔。例: luci-app-zerotier htop'
        required: false
        default: ''
        type: string
      luci_extra_apps:
        description: '集成 LuCI 应用清单 (config/luci-extra.seed: argon 主题(3.0 设置已内置)/diskman/openclash/rclone/ttyd/upnp; passwall 已注释停用)'
        required: false
        default: true
        type: boolean
      enable_quickstart:
        description: '集成 luci-app-quickstart (iStoreOS 风格首页/向导; 自动带入 nas/nas-luci 源, 依赖 iStore 与磁盘工具链, 约增加十几 MB)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    env:
      IWRT_PROFILE: ${{ github.event.inputs.iwrt_profile || 'master' }}
      IWRT_REF: ${{ github.event.inputs.iwrt_ref }}
      LAN_IP: ${{ github.event.inputs.lan_ip || '10.0.0.1' }}
      TIMEZONE: ${{ github.event.inputs.timezone || 'Asia/Shanghai' }}
      UI_LANG: ${{ github.event.inputs.ui_lang || 'zh-cn' }}
      ROOTFS_SIZE: ${{ github.event.inputs.rootfs_size || '2048' }}
      LUCI_FLAVOR: ${{ github.event.inputs.luci_flavor || 'full' }}
      ENABLE_STORE: ${{ github.event.inputs.enable_store }}
      BAKE_DAEDE: ${{ github.event.inputs.bake_daede }}
      ENABLE_HONK: ${{ github.event.inputs.enable_honk }}
      EXTRA_SERVICES: ${{ github.event.inputs.extra_services || 'none' }}
      PPPOE: ${{ github.event.inputs.pppoe }}
      PPPOE_USERNAME: ${{ github.event.inputs.pppoe_username }}
      PPPOE_PASSWORD: ${{ github.event.inputs.pppoe_password }}
      PPPOE_SECRET: ${{ secrets.PPPOE_PASSWORD }}
      ENABLE_IPV6: ${{ github.event.inputs.enable_ipv6 || 'false' }}
      LAN_IPV6_ASSIGN: ${{ github.event.inputs.lan_ipv6_assign || '64' }}
      LAN_IPV6_SUFFIX: ${{ github.event.inputs.lan_ipv6_suffix || 'eui64' }}
      LAN_IPV6_DHCPV6: ${{ github.event.inputs.lan_ipv6_dhcpv6 || 'disabled' }}
      LAN_IPV6_DNS: ${{ github.event.inputs.lan_ipv6_dns || 'false' }}
      HOSTNAME: ${{ github.event.inputs.hostname || 'ImmortalWrt' }}
      ROOT_PASSWORD: ${{ github.event.inputs.root_password }}
      LUCI_EXTRA_APPS: ${{ github.event.inputs.luci_extra_apps }}
      ENABLE_QUICKSTART: ${{ github.event.inputs.enable_quickstart }}
      EXTRA_FEEDS: ${{ github.event.inputs.extra_feeds }}
      EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler dialog dwarves ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gperf help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            re2c rsync scons squashfs-tools subversion swig texinfo unzip \
            vim wget xmlto xxd zlib1g-dev

      - name: Validate inputs
        run: |
          case "$IWRT_PROFILE" in
            master|25.12) ;;
            *) echo "::error::非法 iwrt_profile: $IWRT_PROFILE (可选 master/25.12)"; exit 1 ;;
          esac
          if [ -n "$IWRT_REF" ]; then
            echo "iwrt_ref 显式指定, 优先于 iwrt_profile 默认基线: $IWRT_REF"
          elif [ "$IWRT_PROFILE" = "25.12" ]; then
            # ImmortalWrt 无 v25.12.3+ tag, 此 pin = openwrt-25.12 分支 HEAD
            # (2026-10-24, 已并入上游 25.12.x(.6 世代) 修复)
            IWRT_REF=84b665b5de
          else
            IWRT_REF=f44d1535b4
          fi
          echo "IWRT_REF=$IWRT_REF" >> "$GITHUB_ENV"
          # 构建开始即报解析结果, 防止配置档选错刷错固件 (r23 事故)
          echo "::notice::构建配置档: $IWRT_PROFILE | 基线: $IWRT_REF (master=f44d1535b4/内核6.18, 25.12=84b665b5de/内核6.12)"
          echo "$LAN_IP" | grep -qE '^([0-9]{1,3}\.){3}[0-9]{1,3}$' || { echo "::error::非法 LAN IP: $LAN_IP"; exit 1; }
          if [ "$PPPOE" = "true" ] && [ -z "$PPPOE_USERNAME" ]; then
            echo "::error::启用了 PPPoE 但未填写账号 (pppoe_username)"; exit 1
          fi
          if [ "$PPPOE" = "true" ] && [ -z "$PPPOE_PASSWORD" ] && [ -z "$PPPOE_SECRET" ]; then
            echo "::error::PPPoE 密码为空: 请填写 pppoe_password 或配置仓库 Secret PPPOE_PASSWORD"; exit 1
          fi
          if [ "$ENABLE_HONK" = "true" ] && [ "$BAKE_DAEDE" = "true" ]; then
            echo "::error::enable_honk 与 bake_daede 互斥 (honk 与 dae/daed 同抢 eBPF TC 挂钩, 官方源包亦互斥)"; exit 1
          fi
          # 附加服务 (workflow_dispatch 最多 25 个输入, docker/mwan3 合并成一个选择项)
          case "$EXTRA_SERVICES" in
            none|mwan3|docker|docker+mwan3) ;;
            *) echo "::error::非法 extra_services: $EXTRA_SERVICES (可选 none/mwan3/docker/docker+mwan3)"; exit 1 ;;
          esac
          case "$EXTRA_SERVICES" in *docker*) INCLUDE_DOCKER=true ;; *) INCLUDE_DOCKER=false ;; esac
          case "$EXTRA_SERVICES" in *mwan3*)  ENABLE_MWAN3=true  ;; *) ENABLE_MWAN3=false  ;; esac
          printf 'INCLUDE_DOCKER=%s\nENABLE_MWAN3=%s\n' "$INCLUDE_DOCKER" "$ENABLE_MWAN3" >> "$GITHUB_ENV"
          echo "::notice::附加服务: $EXTRA_SERVICES (docker=$INCLUDE_DOCKER, mwan3=$ENABLE_MWAN3)"
          if [ "$ENABLE_IPV6" = "true" ]; then
            case "$LAN_IPV6_ASSIGN" in
              56|60|64|disabled) ;;
              *) echo "::error::非法 lan_ipv6_assign: $LAN_IPV6_ASSIGN (可选 56/60/64/disabled)"; exit 1 ;;
            esac
            case "$LAN_IPV6_SUFFIX" in
              eui64|random|::1) ;;
              *) echo "::error::非法 lan_ipv6_suffix: $LAN_IPV6_SUFFIX (可选 eui64/random/::1)"; exit 1 ;;
            esac
            case "$LAN_IPV6_DHCPV6" in
              disabled|server) ;;
              *) echo "::error::非法 lan_ipv6_dhcpv6: $LAN_IPV6_DHCPV6 (可选 disabled/server)"; exit 1 ;;
            esac
          fi

      - name: Clone ImmortalWrt source
        run: |
          git clone --filter=blob:none https://github.com/immortalwrt/immortalwrt
          cd immortalwrt
          git checkout "$IWRT_REF"
          git log -1 --format='base: %h %s'

      - name: Cache downloaded sources (dl/)
        uses: actions/cache@v4
        with:
          path: immortalwrt/dl
          key: dl-${{ env.IWRT_REF }}-${{ hashFiles('config/mt5000.seed', 'patches/*.patch', 'patches-25.12/*.patch') }}-${{ env.ROOTFS_SIZE }}-${{ env.BAKE_DAEDE }}-${{ env.INCLUDE_DOCKER }}

      - name: Apply MT5000 device patch
        run: |
          cd immortalwrt
          # master : patches/ = openwrt PR #24237 head (0001 设备支持本体)
          #         + 该 PR 的审阅反馈修复 (0002, 自 dmsza/openwrt 移植)
          #         + 795-12 内核补丁上下文修复 (0003, dmsza b669f86d)
          #         + 交换机初始化强化 + BPDU/IGMP/MLD 陷阱到 CPU (0004,
          #           PR head 89a10ec, 2026-10-26 真机复测通过; 795-11 PPE
          #           卸载重构暂缓, 等 PEPITO82 复位 bug 复测有结论)
          # 25.12 : patches-25.12/ = dmsza/openwrt "[25.12] add support for
          #         GL.iNet GL-MT5000" (现为 af67b61, 审阅修复已并入; 为适配
          #         ImmortalWrt 树已剔除仅涉及 jiorouter 设备的 hunk,
          #         其终态在上游已存在)
          #         + 795-11 VLAN 卸载拒绝 + 795-12 重制 (0002, dmsza 8fbeeb6
          #         + b325c2b 上下文重制; 基线 84b665b5de 内核 6.12.112 的
          #         mtk_probe 错误路径已被上游 stable 改过, 0001 的旧 hunk
          #         形态套不上)。
          #         各自只对已验证的基线保证干净套用。
          case "$IWRT_PROFILE" in
            25.12) PATCHDIR=../patches-25.12 ;;
            *)     PATCHDIR=../patches ;;
          esac
          for p in "$PATCHDIR"/*.patch; do
            echo "applying $p"
            git apply --check "$p" && git apply "$p" || { echo "::error::$p 应用失败 (profile=$IWRT_PROFILE); 基线 $IWRT_REF 可能已变动, 请显式指定已知可用 iwrt_ref 或基于该 profile 重新生成补丁"; exit 1; }
          done

      - name: Overlay files/ and feeds
        run: |
          cd immortalwrt
          cp -r ../files/. ./
          # luci-app-run (wukongdaily 网页上传/运行安装器) 必装: 源码 feed (注意分支是 master)
          echo 'src-git wkd https://github.com/wukongdaily/luci-app-run;master' >> feeds.conf.default
          if [ "$ENABLE_STORE" = "true" ] || [ "$ENABLE_QUICKSTART" = "true" ]; then
            # luci-app-quickstart 硬依赖 luci-app-store, 故 quickstart 也需要 istore 源
            echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default
          fi
          if [ "$ENABLE_QUICKSTART" = "true" ]; then
            # quickstart 首页: 核心包(预编译二进制, 仅 x86_64/aarch64/arm)在
            # nas-packages; LuCI 前端 luci-app-quickstart 在 nas-packages-luci
            echo 'src-git nas https://github.com/linkease/nas-packages;master' >> feeds.conf.default
            echo 'src-git nasluci https://github.com/linkease/nas-packages-luci;main' >> feeds.conf.default
          fi
          if [ "$BAKE_DAEDE" = "true" ]; then
            echo 'src-git daede https://github.com/kenzok8/openwrt-daede' >> feeds.conf.default
          fi
          if [ -n "$EXTRA_FEEDS" ]; then
            printf '%s' "$EXTRA_FEEDS" | tr '|' '\n' | while IFS= read -r FEEDLINE; do
              FEEDLINE=$(printf '%s' "$FEEDLINE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              case "$FEEDLINE" in ''|'#'*) continue ;; esac
              echo "$FEEDLINE" >> feeds.conf.default
              echo "added extra feed: $FEEDLINE"
            done
          fi
          ./scripts/feeds update -a
          # 25.12 profile: the openwrt-25.12 luci feed still ships argon
          # 2.4.7 (no settings UI; the standalone argon-config app does not
          # exist on that branch either). Overlay luci master's theme (3.x,
          # settings built into the theme) so both profiles get the same
          # configurable theme. Remove this block once upstream backports
          # argon 3.x to the openwrt-25.12 luci feed.
          if [ "$IWRT_PROFILE" = "25.12" ]; then
            git -C feeds/luci fetch --depth 1 origin master
            rm -rf feeds/luci/themes/luci-theme-argon
            git -C feeds/luci checkout FETCH_HEAD -- themes/luci-theme-argon
            ARGON_V=$(sed -n 's/^PKG_VERSION:=//p' feeds/luci/themes/luci-theme-argon/Makefile)
            echo "25.12 argon overlay: luci master luci-theme-argon $ARGON_V"
            case "$ARGON_V" in
              [3-9].*) ;;
              *) echo "::error::argon 覆盖后版本非 3.x: '$ARGON_V' (luci master 主题包路径/结构变动? 请核对)"; exit 1 ;;
            esac
          fi
          ./scripts/feeds install -a
          if [ "$ENABLE_STORE" = "true" ] || [ "$ENABLE_QUICKSTART" = "true" ]; then
            ./scripts/feeds install -d y -p istore luci-app-store
          fi
          if [ "$ENABLE_QUICKSTART" = "true" ]; then
            ./scripts/feeds install -f -p nas quickstart
            ./scripts/feeds install -f -p nasluci luci-app-quickstart
          fi
          if [ "$BAKE_DAEDE" = "true" ]; then
            # resolve name conflicts with packages feed, then force-install daede feed versions
            rm -f package/feeds/packages/dae package/feeds/packages/daed
            ./scripts/feeds install -f -p daede dae daed luci-app-daede
            # extend daed reload timeout 75s -> 600s (1GB-RAM devices need longer)
            sed -i 's/const reloadWaitTimeout = 75 \* time.Second/const reloadWaitTimeout = 600 * time.Second/' \
              feeds/daede/daed/patches/0004-restart-daed-on-dashboard-reload-timeout.patch || \
              echo "::warning::daed 0004 补丁结构已变动, 600s 超时修改未应用 (沿用默认 75s)"
          fi
          if [ -n "$EXTRA_FEEDS" ]; then
            # extra feeds take precedence over stock feeds on package-name conflicts
            for FEED in $(printf '%s' "$EXTRA_FEEDS" | tr '|' '\n' | sed -n 's/^src-git[[:space:]][[:space:]]*\([^ ;]*\).*/\1/p'); do
              echo "force-installing packages from extra feed: $FEED"
              ./scripts/feeds install -a -f -p "$FEED" || echo "::warning::feed $FEED 强制安装失败(名称是否正确?)"
            done
          fi

      - name: Generate .config
        run: |
          cd immortalwrt
          cp ../config/mt5000.seed .config

          # --- parameterize seed ---
          LAN_BC="${LAN_IP%.*}.255"
          sed -i "s|^CONFIG_TARGET_ROOTFS_PARTSIZE=.*|CONFIG_TARGET_ROOTFS_PARTSIZE=$ROOTFS_SIZE|" .config
          sed -i "s|^CONFIG_TARGET_PREINIT_IP=.*|CONFIG_TARGET_PREINIT_IP=\"$LAN_IP\"|" .config
          sed -i "s|^CONFIG_TARGET_PREINIT_BROADCAST=.*|CONFIG_TARGET_PREINIT_BROADCAST=\"$LAN_BC\"|" .config

          if [ "$UI_LANG" = "en" ]; then
            sed -i 's|^CONFIG_LUCI_LANG_zh_Hans=y|# CONFIG_LUCI_LANG_zh_Hans is not set|' .config
          fi

          if [ "$LUCI_FLAVOR" = "light" ]; then
            printf 'CONFIG_PACKAGE_luci-light=y\n# CONFIG_PACKAGE_luci is not set\n' >> .config
          else
            # full 套件必须显式选中: uhttpd / luci-mod-* / bootstrap 主题只由
            # luci 合集拉起, 缺了它固件里只有 luci-base + apps, 没有Web服务器
            printf 'CONFIG_PACKAGE_luci=y\n' >> .config
          fi

          if [ "$ENABLE_STORE" != "true" ]; then
            sed -i 's|^CONFIG_PACKAGE_luci-app-store=y|# CONFIG_PACKAGE_luci-app-store is not set|' .config
          fi

          if [ "$ENABLE_QUICKSTART" = "true" ]; then
            # quickstart 首页/向导 (iStoreOS 风格); 核心包 quickstart 与
            # luci-app-store 由 defconfig 依依赖链自动选中
            printf 'CONFIG_PACKAGE_luci-app-quickstart=y\n' >> .config
          fi

          if [ "$BAKE_DAEDE" = "true" ]; then
            printf 'CONFIG_PACKAGE_luci-app-daede=y\nCONFIG_PACKAGE_luci-app-daede_daed=y\nCONFIG_PACKAGE_daed=y\n' >> .config
          fi

          if [ "$INCLUDE_DOCKER" = "true" ]; then
            printf '%s\n' \
              'CONFIG_KERNEL_CGROUPS=y' \
              'CONFIG_KERNEL_CGROUP_CPUACCT=y' \
              'CONFIG_KERNEL_CGROUP_DEVICE=y' \
              'CONFIG_KERNEL_CGROUP_FREEZER=y' \
              'CONFIG_KERNEL_CGROUP_SCHED=y' \
              'CONFIG_KERNEL_MEMCG=y' \
              'CONFIG_KERNEL_NAMESPACES=y' \
              'CONFIG_PACKAGE_cgroupfs-mount=y' \
              'CONFIG_PACKAGE_docker=y' \
              'CONFIG_PACKAGE_dockerd=y' \
              'CONFIG_PACKAGE_luci-app-dockerman=y' >> .config
          fi

          # mwan3 (extra_services 含 mwan3 时). 编入时同时生成首启修复脚本 99-mwan3-ipv4:
          # mwan3 自带 default_rule_v6 -> balanced 策略, 而 balanced 没有 IPv6
          # 成员时会给每个 IPv6 包打上 unreachable 标记(ip -6 rule fwmark
          # 0x3e00/0x3f00 unreachable), 路由器与下游设备的 IPv6 全部
          # ENETUNREACH(症状: 有公网 IPv6 地址但上不了 IPv6 网站)。
          if [ "$ENABLE_MWAN3" = "true" ]; then
            printf '%s\n' \
              'CONFIG_PACKAGE_mwan3=y' \
              'CONFIG_PACKAGE_luci-app-mwan3=y' >> .config
          fi

          # honk (enable_honk): 运行时依赖预编入。首启安装走 daeuniverse 官方
          # apk 源, 但本固件基于 ImmortalWrt snapshot, 自带 apk 源会被首启清理
          # (404), 故 libstdcpp/kmod-*/v2ray-geo* 必须已在固件里; geo 数据一并
          # 编入省去首启下载。vmlinux-btf-builtin (空包) 由官方源提供, 无需编入。
          if [ "$ENABLE_HONK" = "true" ]; then
            printf '%s\n' \
              'CONFIG_PACKAGE_libstdcpp=y' \
              'CONFIG_PACKAGE_kmod-nft-core=y' \
              'CONFIG_PACKAGE_kmod-nfnetlink-queue=y' \
              'CONFIG_PACKAGE_kmod-nf-conntrack=y' \
              'CONFIG_PACKAGE_v2ray-geoip=y' \
              'CONFIG_PACKAGE_v2ray-geosite=y' >> .config
          fi

          if [ "$LUCI_EXTRA_APPS" != "false" ] && [ "$LUCI_EXTRA_APPS" != "" ]; then
            # curated LuCI app list (all stock-feed packages)
            cat ../config/luci-extra.seed >> .config
          fi

          if [ -n "$EXTRA_PACKAGES" ]; then
            for PKG in $EXTRA_PACKAGES; do
              case "$PKG" in '#'*) continue ;; esac
              printf 'CONFIG_PACKAGE_%s=y\n' "$PKG" >> .config
            done
          fi

          make defconfig

          echo "=== sanity check ==="
          grep -qE 'TARGET_mediatek_filogic_DEVICE_glinet_gl-mt5000=y' .config || { echo "::error::设备目标缺失"; exit 1; }
          grep -qE 'CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config            || { echo "::error::内核 BTF 缺失"; exit 1; }
          grep -qE 'CONFIG_PACKAGE_luci-app-run=y' .config             || { echo "::error::luci-app-run 缺失 (wkd feed 安装失败?)"; exit 1; }
          # USB 网络(网卡/4G/5G 转接板/手机共享)关键符号抽查
          for U in kmod-usb3 kmod-usb-net-qmi-wwan kmod-usb-net-cdc-mbim kmod-usb-net-cdc-ncm kmod-usb-net-rndis kmod-usb-net-ipheth kmod-usb-net-rtl8152; do
            grep -qE "^CONFIG_PACKAGE_${U}=y" .config || { echo "::error::USB 网络组件缺失: $U (包名变动? 请核对 config/mt5000.seed)"; exit 1; }
          done
          if [ "$ENABLE_MWAN3" = "true" ]; then
            for U in mwan3 luci-app-mwan3; do
              grep -qE "^CONFIG_PACKAGE_${U}=y" .config || { echo "::error::多线管理组件缺失: $U (extra_services 含 mwan3 但未编入?)"; exit 1; }
            done
          fi
          grep -qE '^CONFIG_PACKAGE_(luci|luci-light)=y' .config      || { echo "::error::LuCI 套件未生效 (luci_flavor)"; exit 1; }
          grep -qE '^CONFIG_PACKAGE_uhttpd=y' .config                 || { echo "::error::uhttpd 缺失: LuCI 无 Web 服务器, 管理页面将无法访问"; exit 1; }
          grep -q "CONFIG_TARGET_PREINIT_IP=\"$LAN_IP\"" .config       || { echo "::error::LAN IP 未生效"; exit 1; }
          grep -qE "CONFIG_TARGET_ROOTFS_PARTSIZE=$ROOTFS_SIZE" .config || { echo "::error::分区大小未生效"; exit 1; }
          if [ "$ENABLE_STORE" = "true" ]; then
            grep -qE 'CONFIG_PACKAGE_luci-app-store=y' .config || { echo "::error::iStore 缺失"; exit 1; }
          fi
          if [ "$ENABLE_QUICKSTART" = "true" ]; then
            grep -qE 'CONFIG_PACKAGE_luci-app-quickstart=y' .config || { echo "::error::luci-app-quickstart 缺失 (nasluci feed 安装失败?)"; exit 1; }
            grep -qE 'CONFIG_PACKAGE_quickstart=y' .config || { echo "::error::quickstart 核心包缺失 (依赖或架构 aarch64 不满足?)"; exit 1; }
          fi
          if [ "$BAKE_DAEDE" = "true" ]; then
            grep -qE 'CONFIG_PACKAGE_daed=y' .config || { echo "::error::daed 缺失"; exit 1; }
          fi
          if [ "$ENABLE_HONK" = "true" ]; then
            # honk 运行时依赖抽查 + 官方包互斥项 (dae/daed 与 honk 不能共存)
            for U in libstdcpp kmod-veth kmod-sched-core kmod-sched-bpf kmod-nft-core kmod-nft-queue kmod-nfnetlink-queue kmod-nf-conntrack v2ray-geoip v2ray-geosite ca-bundle; do
              grep -qE "^CONFIG_PACKAGE_${U}=y" .config || { echo "::error::honk 运行依赖缺失: $U (包名变动? 请核对 config/mt5000.seed 或 enable_honk 依赖块)"; exit 1; }
            done
            if grep -qE '^CONFIG_PACKAGE_(dae|daed)=y' .config; then
              echo "::error::dae/daed 与 honk 不能共存 (官方源互斥, eBPF TC 挂钩冲突)"; exit 1
            fi
          fi
          if [ "$LUCI_EXTRA_APPS" != "false" ] && [ "$LUCI_EXTRA_APPS" != "" ]; then
            MISSING_LUCI=""
            for OPT in $(grep -oE '^CONFIG_PACKAGE_[A-Za-z0-9_.-]+=y' ../config/luci-extra.seed | sed 's/^CONFIG_PACKAGE_//;s/=y$//'); do
              grep -q "^CONFIG_PACKAGE_${OPT}=y" .config || MISSING_LUCI="$MISSING_LUCI $OPT"
            done
            if [ -n "$MISSING_LUCI" ]; then
              echo "::error::luci-extra 清单中以下条目未生效(基础包名错误或依赖不满足, 请核对 config/luci-extra.seed):$MISSING_LUCI"
              exit 1
            fi
            echo "luci-extra apps: $(grep -cE '^CONFIG_PACKAGE_luci-(app|theme)[A-Za-z0-9_.-]*=y' ../config/luci-extra.seed) entries OK"
          fi
          if [ -n "$EXTRA_PACKAGES" ]; then
            MISSING=""
            for PKG in $EXTRA_PACKAGES; do
              case "$PKG" in '#'*) continue ;; esac
              grep -q "^CONFIG_PACKAGE_${PKG}=y" .config || MISSING="$MISSING $PKG"
            done
            if [ -n "$MISSING" ]; then
              echo "::error::以下额外软件包未生效(名称错误或依赖未满足):$MISSING"
              exit 1
            fi
          fi
          echo "sanity check passed"

      - name: Generate first-boot customization (uci-defaults)
        run: |
          cd immortalwrt
          UD=files/etc/uci-defaults
          mkdir -p "$UD"

          # timezone (POSIX TZ for busybox)
          case "$TIMEZONE" in
            Asia/Shanghai)    TZP='CST-8' ;;
            Asia/Hong_Kong)   TZP='HKT-8' ;;
            Asia/Taipei)      TZP='CST-8' ;;
            Asia/Tokyo)       TZP='JST-9' ;;
            Asia/Singapore)   TZP='SGT-8' ;;
            Europe/Berlin)    TZP='CET-1CEST,M3.5.0,M10.5.0/3' ;;
            *)                TZP='UTC0' ;;
          esac
          printf '%s\n' \
            '#!/bin/sh' \
            "uci set system.@system[0].timezone='$TZP'" \
            "uci set system.@system[0].zonename='$TIMEZONE'" \
            'uci commit system' > "$UD/99-timezone"

          # hostname
          printf '%s\n' \
            '#!/bin/sh' \
            "uci set system.@system[0].hostname='$HOSTNAME'" \
            'uci commit system' > "$UD/99-hostname"

          # root password (empty input = keep no password; only written when
          # root has no password yet, so config-keeping sysupgrades never
          # clobber a password the user has already set; runs at S10-boot,
          # before dropbear/uhttpd start)
          if [ -n "$ROOT_PASSWORD" ]; then
            HASH=$(printf '%s' "$ROOT_PASSWORD" | openssl passwd -6 -stdin)
            printf '%s\n' \
              '#!/bin/sh' \
              '# 仅当 root 尚无密码(全新刷机)时写入默认密码;' \
              '# 保留配置升级时 /etc/shadow 随配置保留, 此脚本不会覆盖已设密码' \
              "if grep -q '^root::' /etc/shadow; then" \
              "  sed -i 's|^root::|root:$HASH:|' /etc/shadow" \
              'fi' \
              'exit 0' > "$UD/99-root-password"
          fi

          # UI language
          if [ "$UI_LANG" = "zh-cn" ]; then
            printf '%s\n' \
              '#!/bin/sh' \
              "uci set luci.main.lang='zh_cn'" \
              'uci commit luci' > "$UD/99-luci-lang"
          fi

          # PPPoE (WAN = eth1 on MT5000)
          if [ "$PPPOE" = "true" ]; then
            PP="$PPPOE_PASSWORD"
            [ -z "$PP" ] && PP="$PPPOE_SECRET"
            PPE=$(printf '%s' "$PP" | sed "s/'/'\\\\''/g")
            UPE=$(printf '%s' "$PPPOE_USERNAME" | sed "s/'/'\\\\''/g")
            printf '%s\n' \
              '#!/bin/sh' \
              "uci set network.wan.proto='pppoe'" \
              "uci set network.wan.username='$UPE'" \
              "uci set network.wan.password='$PPE'" \
              'uci commit network' > "$UD/99-pppoe"
          fi

          # IPv6 (参考 Aethersailor/Custom_OpenClash_Rules wiki "OpenWrt IPv6 设置方案")
          #   WAN 侧两种拨号的 PD 机制不同:
          #   PPPoE    -> ppp6-up 以 AUTOIPV6 自动生成动态 wan_6 (dhcpv6+PD),
          #               前提是 wan.ipv6 留空/auto (显式 ipv6=1 会禁用它)
          #   DHCP WAN -> proto dhcp 不会自动生成 wan_6, 需显式 wan6 承载 PD
          #   LAN: 从上游委派前缀中划分子网, RA 服务器 + SLAAC 下发, 关闭 NDP 代理
          if [ "$ENABLE_IPV6" = "true" ]; then
            IU="$UD/99-ipv6"
            printf '%s\n' \
              '#!/bin/sh' \
              '# IPv6 per Aethersailor/Custom_OpenClash_Rules wiki (OpenWrt IPv6 设置方案)' \
              "# 生成参数: ip6assign=$LAN_IPV6_ASSIGN ip6ifaceid=$LAN_IPV6_SUFFIX dhcpv6=$LAN_IPV6_DHCPV6 ipv6_dns=$LAN_IPV6_DNS" \
              '' \
              '# --- WAN: 委托上游前缀 (netifd 核心默认已开, 显式写明以对齐教程) ---' \
              "uci -q set network.wan.delegate='1'" \
              '# 关键: wan.ipv6 必须留空/auto。ppp.sh 只在留空或 auto 时设 AUTOIPV6,' \
              '# 显式 ipv6=1 只做 IPv6CP、不会自动生成动态 wan_6 (旧脚本 r9 上' \
              '# wan_6 缺失的根因), 故必须删掉它 (含保留配置升级时的残留)' \
              'uci -q delete network.wan.ipv6' \
              'uci -q delete network.wan.ip6assign' \
              'uci -q delete network.wan.ip6class' \
              'uci -q delete network.wan.ip6hint' \
              'uci -q delete network.wan.ip6weight' \
              '[ -n "$(uci -q get dhcp.wan)" ] && uci -q set dhcp.wan.ignore=1' > "$IU"
            if [ "$PPPOE" = "true" ]; then
              # PPPoE: ipv6 留空 -> pppd IPv6CP up 后 ppp6-up 自动创建动态 wan_6
              # (proto dhcpv6, ifname @wan, PD 默认开启), 即教程方案A 的行为;
              # 删除静态 wan6 (出厂默认或旧固件手动残留), 避免与 wan_6 双客户端
              printf '%s\n' \
                '' \
                '# --- PPPoE: 依赖自动生成的动态 wan_6 (dhcpv6 客户端 + PD) ---' \
                'uci -q delete network.wan6' >> "$IU"
            else
              # DHCP WAN: proto dhcp 没有任何自动生成 wan_6 的机制,
              # PD 必须由显式 wan6 (dhcpv6 客户端, 与 wan 同端口) 承载 (教程方案B)
              printf '%s\n' \
                '' \
                '# --- DHCP WAN: 确保 wan6 (dhcpv6 客户端) 存在并承载 PD ---' \
                'uci -q set network.wan6=interface' \
                'WANDEV=$(uci -q get network.wan.device || uci -q get network.wan.ifname)' \
                '[ -n "$WANDEV" ] && uci -q set network.wan6.device="$WANDEV"' \
                "uci -q set network.wan6.proto='dhcpv6'" \
                "uci -q set network.wan6.reqaddress='try'" \
                "uci -q set network.wan6.reqprefix='auto'" >> "$IU"
            fi
            printf '%s\n' \
              '' \
              '# --- LAN: 从委派前缀中划分子网 ---' \
              "uci -q set network.lan.delegate='1'" \
              "uci -q set network.lan.ipv6='1'" \
              "uci -q set network.lan.ip6ifaceid='$LAN_IPV6_SUFFIX'" >> "$IU"
            if [ "$LAN_IPV6_ASSIGN" = "disabled" ]; then
              printf '%s\n' \
                '# 不向下游分配公网 IPv6 前缀' \
                'uci -q delete network.lan.ip6assign' >> "$IU"
            else
              printf '%s\n' \
                "uci -q set network.lan.ip6assign='$LAN_IPV6_ASSIGN'" >> "$IU"
            fi
            printf '%s\n' \
              '' \
              '# --- LAN DHCP 服务器: RA 服务器 + SLAAC, NDP 代理关闭 ---' \
              'uci -q get dhcp.lan >/dev/null || { uci -q set dhcp.lan=dhcp; uci -q set dhcp.lan.interface=lan; }' \
              "uci -q set dhcp.lan.ra='server'" \
              "uci -q set dhcp.lan.ra_slaac='1'" \
              "uci -q set dhcp.lan.ndp='disabled'" \
              "uci -q set dhcp.lan.dhcpv6='$LAN_IPV6_DHCPV6'" >> "$IU"
            if [ "$LAN_IPV6_DHCPV6" = "disabled" ]; then
              printf '%s\n' \
                '# 无 DHCPv6 -> RA 不带 M/O 标志 (纯 SLAAC)' \
                'uci -q delete dhcp.lan.ra_flags' \
                "uci -q add_list dhcp.lan.ra_flags='none'" >> "$IU"
            else
              printf '%s\n' \
                '# 有状态 DHCPv6 -> RA 带 M/O 标志' \
                'uci -q delete dhcp.lan.ra_flags' \
                "uci -q add_list dhcp.lan.ra_flags='managed-config'" \
                "uci -q add_list dhcp.lan.ra_flags='other-config'" >> "$IU"
            fi
            if [ "$LAN_IPV6_DNS" = "true" ]; then
              printf '%s\n' \
                "uci -q set dhcp.lan.dns_service='1'" >> "$IU"
            else
              printf '%s\n' \
                '# 不通告路由器为 IPv6 DNS -> 客户端继续用路由器 IPv4 地址解析, 保持 OpenClash 分流' \
                "uci -q set dhcp.lan.dns_service='0'" \
                'uci -q delete dhcp.lan.dns' >> "$IU"
            fi
            printf '%s\n' \
              '' \
              '# --- dnsmasq: 不过滤 IPv6 AAAA 记录 ---' \
              "uci -q set dhcp.@dnsmasq[0].filter_aaaa='0'" \
              '' \
              'uci -q commit network' \
              'uci -q commit dhcp' \
              'exit 0' >> "$IU"
            [ -s "$IU" ] || { echo "::error::99-ipv6 未生成"; exit 1; }
          fi

          # mwan3 (opt-in): 只让它接管 IPv4, 否则它的默认策略会把 IPv6 打死。
          # 背景: mwan3 自带配置里 default_rule_v6 指向 balanced 策略, 而
          # balanced 只有 IPv4 成员; mwan3 对"策略里没有可用成员"的处理是
          # last_resort unreachable -> 每个 IPv6 包被打上 fwmark 0x3e00,
          # 命中 ip6 rule "fwmark 0x3e00/0x3f00 unreachable"(优先级 2062,
          # 先于 main 表), 路由器自身与下游设备的 IPv6 全部 ENETUNREACH。
          # 现象就是"下游能拿到公网 IPv6 地址, 但访问不了 IPv6 网站",
          # 且 IPv4 完全正常; odhcpd 侧还会因看不到可路由默认路由而把 RA
          # 的 router lifetime 置 0。
          # https 规则没写 family, 默认 v4/v6 都会装; 这里限定为 IPv4。
          if [ "$ENABLE_MWAN3" = "true" ]; then
            cat > "$UD/99-mwan3-ipv4" <<'EOF'
          #!/bin/sh
          # mwan3 默认配置会破坏 IPv6 (见上面的说明):
          #   mwan3.default_rule_v6 -> balanced 策略(无 IPv6 成员)
          #   -> IPv6 包被打 fwmark 0x3e00 -> ip -6 rule unreachable -> 全网 IPv6 不通
          # 修复: 让 mwan3 的规则只作用于 IPv4, 删掉 IPv6 默认规则。
          # 若将来真的要 mwan3 管 IPv6, 需要建 family ipv6 的接口/成员/策略,
          # 仅 uci set mwan3.wan6.enabled='1' 是不够的。
          [ -n "$(uci -q get mwan3.https)" ] && uci -q set mwan3.https.family='ipv4'
          uci -q delete mwan3.default_rule_v6
          uci -q commit mwan3
          exit 0
          EOF
            chmod 755 "$UD/99-mwan3-ipv4"
            [ -s "$UD/99-mwan3-ipv4" ] || { echo "::error::99-mwan3-ipv4 未生成"; exit 1; }
          fi

          chmod 755 "$UD"/99-*
          ls -la "$UD"/

      - name: Generate honk auto-install (optional)
        run: |
          cd immortalwrt
          if [ "$ENABLE_HONK" != "true" ]; then
            echo "enable_honk 未启用, 跳过"
            exit 0
          fi
          # honk 经 daeuniverse 官方 apk 源安装 (https://openwrt.daeuniverse.org,
          # honk 包内置 doona 面板, 取代旧 bake_doona 手搭的 Zakkaus overlay)。
          # 生成三件套: 预置默认配置 + WAN 联网自动安装 + /etc/honk 备份;
          # 二进制来自官方源, 后续升级走 apk / LuCI。
          mkdir -p files/usr/bin files/etc/honk files/etc/hotplug.d/iface files/etc/uci-defaults
          install -m 0755 ../config/honk/honk-install files/usr/bin/honk-install
          install -m 0755 ../config/honk/99-honk-install.hotplug files/etc/hotplug.d/iface/99-honk-install
          # 默认配置 = qichiyuhub config.min.dae (vendored, lan_interface 已按
          # 其文件内说明改为 br-lan); 属 honk 包 conffile, 升级不会被包默认覆盖
          cp ../config/honk/config.min.dae files/etc/honk/config.dae
          grep -q "lan_interface: br-lan" files/etc/honk/config.dae || {
            echo "::error::honk 配置模板 lan_interface 不再是 br-lan (config/honk/config.min.dae 被改动?)"; exit 1; }
          # /etc/honk (配置+面板数据) 加入 sysupgrade 备份 (幂等; 官方包自身的
          # keep.d 只保留 /etc/honk/data/)
          cat > files/etc/uci-defaults/99-honk-sysupgrade <<'EOF'
          #!/bin/sh
          grep -q '^/etc/honk/' /etc/sysupgrade.conf 2>/dev/null || \
              printf '%s\n' '/etc/honk/' >> /etc/sysupgrade.conf
          exit 0
          EOF
          chmod 755 files/etc/uci-defaults/99-honk-sysupgrade
          echo "honk 自动安装三件套已生成 (config: qichiyuhub config.min, lan=br-lan)"

      - name: Download sources
        run: |
          cd immortalwrt
          make download -j"$(nproc)"

      - name: Build firmware
        run: |
          cd immortalwrt
          make -j"$(nproc)" || { echo "::group::verbose retry log"; make -j1 V=s; echo "::endgroup::"; exit 1; }

      - name: Show images
        run: |
          ls -lh immortalwrt/bin/targets/mediatek/filogic/ || true

      - name: Generate release notes
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          IMGDIR=immortalwrt/bin/targets/mediatek/filogic
          SYS=$(ls "$IMGDIR" 2>/dev/null | grep 'glinet_gl-mt5000-squashfs-sysupgrade.bin$' | head -n1)
          [ -n "$SYS" ] || SYS="(见附件)"
          [ "$ENABLE_STORE" = "true" ]  && STORE_OPT='已集成'  || STORE_OPT='未集成'
          [ "$BAKE_DAEDE" = "true" ]   && DAEDE_OPT='编入固件(600s 超时补丁)' || DAEDE_OPT='运行时安装(默认)'
          if [ "$ENABLE_HONK" = "true" ]; then HONK_OPT='首启自动安装 (daeuniverse 官方源, 内置 doona 面板)'; else HONK_OPT='未集成'; fi
          [ "$INCLUDE_DOCKER" = "true" ] && DOCKER_OPT='已集成' || DOCKER_OPT='未集成'
          if [ "$ENABLE_MWAN3" = "true" ]; then MWAN3_OPT='已集成 (仅接管 IPv4; 已打 IPv6 防打标修复)'; else MWAN3_OPT='未集成'; fi
          if [ "$LUCI_EXTRA_APPS" != "false" ] && [ "$LUCI_EXTRA_APPS" != "" ]; then LUCI_EXTRA_OPT='已集成(argon 主题/diskman/openclash/rclone/ttyd/upnp; passwall 已注释停用)'; else LUCI_EXTRA_OPT='未集成'; fi
          if [ "$ENABLE_QUICKSTART" = "true" ]; then QS_OPT='已集成 (iStoreOS 风格首页/向导)'; else QS_OPT='未集成'; fi
          if [ "$PPPOE" = "true" ]; then PPPOE_OPT="已预置 (账号密码不显示)"; else PPPOE_OPT='未预置 (DHCP)'; fi
          if [ "$LUCI_FLAVOR" = "light" ]; then LUCI_OPT='luci-light (精简)'; else LUCI_OPT='luci (完整)'; fi
          if [ "$ENABLE_IPV6" = "true" ]; then
            if [ "$LAN_IPV6_DNS" = "true" ]; then IPV6_DNS_OPT='通告 IPv6 DNS'; else IPV6_DNS_OPT='不通告 IPv6 DNS(DNS 走 IPv4)'; fi
            IPV6_OPT="已启用 (WAN 委托前缀 + LAN RA/SLAAC, ip6assign=$LAN_IPV6_ASSIGN, 后缀 $LAN_IPV6_SUFFIX, DHCPv6 $LAN_IPV6_DHCPV6, $IPV6_DNS_OPT)"
          else
            IPV6_OPT='未启用 (首启脚本不写 IPv6 配置)'
          fi
          if [ -z "$ROOT_PASSWORD" ]; then
            ROOTPWD_OPT='无密码'
            LOGIN_NOTE='账号 root,无密码,请尽快设置'
          else
            if [ "$ROOT_PASSWORD" = "root" ]; then ROOTPWD_OPT='root(默认)'; else ROOTPWD_OPT='自定义(不回显)'; fi
            LOGIN_NOTE="账号 root,密码 $ROOTPWD_OPT,请尽快修改"
          fi

          {
            echo "## ImmortalWrt — GL.iNet MT5000 (Brume 3)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 构建编号 | r${{ github.run_number }} |"
