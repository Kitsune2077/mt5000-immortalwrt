            echo "| PPPoE | $PPPOE_OPT |"
            echo "| IPv6 | $IPV6_OPT |"
            echo "| 主机名 | $HOSTNAME |"
            echo "| root 密码 | $ROOTPWD_OPT |"
            echo ""
            echo "### 固件内置"
            echo ""
            echo "- MT5000 设备支持(上游 PR [openwrt#24237](https://github.com/openwrt/openwrt/pull/24237) 移植 + 审阅反馈修复)"
            echo "- 已在本项目固件之间升级时 sysupgrade 可保留配置(eMMC + platform_copy_config)"
            echo "- LuCI 应用精选清单(见 config/luci-extra.seed)"
            echo "- 内核 BTF + XDP_SOCKETS(eBPF CO-RE 前置,daede 可用)"
            echo "- daede 运行前置依赖:kmod 五件套 + v2ray geo 数据 + ca-bundle"
            echo "- autocore 状态页(CPU 型号/频率/温度)"
            echo "- luci-app-run 网页上传/运行安装器(必装, 支持 .run/.sh/.ipk/.apk)"
            echo "- USB 口网络全家桶:USB 网卡(RTL815x/AX88179/ASIX/LAN78xx)、4G/5G 转接板(QMI/MBIM/NCM+串口)、手机 USB 共享(安卓 RNDIS/NCM、iPhone)"
            if [ "$ENABLE_MWAN3" = "true" ]; then
              echo "- mwan3 多线管理(有线/随身WiFi/手机共享 优先级与故障转移, LuCI「网络→Multi WAN」; 已限定只接管 IPv4, 不会影响 IPv6)"
            fi
            echo "- 随身WiFi/USB网卡即插即用: 插入自动建接口+挂防火墙(metric=50 默认备份线, 零点击)"
            echo "- 首启自动清理会 404 的 apk 软件源"
            echo ""
            echo "### 刷机方法"
            echo ""
            echo "1. 主升级文件:\`$SYS\`"
            echo "2. 原厂固件:管理界面「升级」页直接上传该文件;或在 SSH 中执行"
            echo '   ```'
            echo '   sysupgrade -n /tmp/*.bin   # -n 不保留配置(从原厂升级务必使用)'
            echo '   ```'
            echo "3. 已在 ImmortalWrt:系统「备份/升级」页上传,可保留配置"
            echo "4. 刷机后访问 http://$LAN_IP ($LOGIN_NOTE)"
            echo ""
            if [ "$ENABLE_HONK" = "true" ]; then
              echo "### honk 代理(首启自动安装)"
              echo ""
              echo "- WAN 首次联网后自动从 daeuniverse 官方源安装 honk (内置 doona 面板), 运行依赖已编入固件"
              echo "- 面板: http://$LAN_IP:9090/ui/ 首次打开创建管理员; 默认配置为 qichiyuhub config.min 分流模板, 订阅在面板里改"
              echo "- 与 dae/daed 不能共存 (eBPF TC 冲突); 若首启时未联网, 联网后 SSH 执行 honk-install 即可"
              echo "- 配置与面板数据在 /etc/honk (已加入 sysupgrade 备份)"
            else
              echo "### daede 代理安装(未编入固件时)"
              echo ""
              echo '   ```'
              echo '   wget -O - https://raw.githubusercontent.com/kenzok8/openwrt-daede/refs/heads/main/scripts/install.sh | ash'
              echo '   ```'
            fi
            echo ""
            echo "> 完整校验值见附件 sha256sums;软件清单见 *.manifest;构建配置见 config.buildinfo"
          } > release_notes.md

          echo "=== release notes ==="
          cat release_notes.md

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-mt5000-${{ env.IWRT_PROFILE }}-r${{ github.run_number }}-${{ env.IWRT_REF }}
          path: |
            immortalwrt/bin/targets/mediatek/filogic/*glinet_gl-mt5000*
            immortalwrt/bin/targets/mediatek/filogic/sha256sums
            immortalwrt/bin/targets/mediatek/filogic/config.buildinfo
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: mt5000-r${{ github.run_number }}
          name: MT5000 固件 (${{ env.IWRT_PROFILE }}) r${{ github.run_number }} (base ${{ env.IWRT_REF }})
          body_path: release_notes.md
          # 不加 *.manifest: 会被 *glinet_gl-mt5000* 重复匹配, 同一文件并发上传
          # 两次会撞 action-gh-release 同名资产竞态 (r25 的 release 因此卡死在 draft)
          files: |
            immortalwrt/bin/targets/mediatek/filogic/*glinet_gl-mt5000*
            immortalwrt/bin/targets/mediatek/filogic/sha256sums
            immortalwrt/bin/targets/mediatek/filogic/config.buildinfo
